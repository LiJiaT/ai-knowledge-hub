<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI 知识库</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#9da7b3;--accent:#75b8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
main{max-width:1080px;margin:auto;padding:80px 28px 50px}.eyebrow{color:var(--accent);font-size:13px;letter-spacing:.16em;margin:0 0 16px}h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.04em;line-height:1.2;margin:0 0 20px}.intro{max-width:630px;color:var(--muted);font-size:17px;margin:0 0 44px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;display:flex;flex-direction:column;min-height:290px;padding:26px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:inherit;text-decoration:none}.card.active{transition:border-color .15s,transform .15s}.card.active:hover{border-color:var(--accent);transform:translateY(-3px)}.card.active:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.label{font-size:12px;color:var(--accent);letter-spacing:.06em}.pending .label{color:var(--muted)}h2{font-size:23px;margin:22px 0 12px}.description{margin:0;color:var(--muted);font-size:14px}.action{margin-top:auto;padding-top:26px;font-size:14px;color:var(--accent)}.pending .action{color:var(--muted)}footer{margin-top:42px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}@media(max-width:760px){main{padding-top:48px}.grid{grid-template-columns:1fr}.card{min-height:240px}}
</style>
</head>
<body>
<main>
<p class="eyebrow">AI KNOWLEDGE HUB</p>
<h1>把值得读的，放在一起。</h1>
<p class="intro">从公众号实践、研究论文到开源项目，发现 AI 使用与工程落地中值得关注的内容。</p>
<div class="grid">
<a class="card active" href="./gzh/">
<span class="label">公众号 · 已接入</span><h2>公众号 AI 库</h2>
<p class="description">浏览精选文章、中文摘要与推荐理由，按主题、公众号和九维评分筛选。</p>
<span class="action">浏览文章 →</span>
</a>
<section class="card pending" aria-label="论文库，待接入">
<span class="label">论文 · 待接入</span><h2>AI 论文库</h2>
<p class="description">研究论文的分类索引、摘要与阅读入口。</p><span class="action">接入后开放</span>
</section>
<section class="card pending" aria-label="GitHub Radar，待接入">
<span class="label">开源 · 待接入</span><h2>GitHub Radar</h2>
<p class="description">关注值得跟进的 AI 开源项目、工具与工程实践。</p><span class="action">接入后开放</span>
</section>
</div>
<footer>精选内容与原文链接 · 同一入口，持续更新</footer>
</main>
</body>
</html>
